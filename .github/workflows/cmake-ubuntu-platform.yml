# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on ubuntu

on:
  # push:
  #   branches: [ "main" ]
  #   paths:
  #     - '**/*.h'
  #     - '**/*.hpp'
  #     - '**/*.ui'
  #     - '**/*.cmake'
  #     - '**/*.cpp'
  #     - '**/*.rc'
  #     - '**/*.qrc'
  #     - 'CMakeLists.txt'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.ui'
      - '**/*.cmake'
      - '**/*.cpp'
      - '**/*.rc'
      - '**/*.qrc'
      - 'CMakeLists.txt'
      - '**/**/*.yml'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-22.04

    steps:
    - name: Update system packages 
      run: sudo apt update
    - name: Install dependencies
      run: sudo apt install -y openssl libssl-dev libgl1-mesa-dev
    - name: Verify OpenSSL installation 
      run: openssl version
    - name: Install Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.3'
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        cache: true
        modules: 'qtcharts qtdatavis3d qtimageformats qtnetworkauth qtgraphs'
    - name: Show QT install dir
      run: echo "${{ env.QT_ROOT_DIR }}"
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Build libde265
      run: |
        cd ${{github.workspace}}
        wget https://github.com/strukturag/libde265/releases/download/v1.0.16/libde265-1.0.16.tar.gz
        tar -zxf libde265-1.0.16.tar.gz
        cd libde265-1.0.16
        mkdir build
        cd build
        cmake .. -DENABLE_DECODER=OFF -DENABLE_ENCODER=OFF -DENABLE_SDL=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/thirdparty/libde265/linux
        cmake --build . -j 4
        cmake --install .
    
    - name: Build libheif
      run: |
        cd ${{github.workspace}}
        wget https://github.com/strukturag/libheif/releases/download/v1.21.2/libheif-1.21.2.tar.gz
        tar -zxf libheif-1.21.2.tar.gz
        cd libheif-1.21.2
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/thirdparty/libheif/linux \
          -DCMAKE_CXX_FLAGS="${CMAKE_CXX_FLAGS} -DLIBDE265_STATIC_BUILD" \
          -DWITH_LIBDE265=ON \
          -DWITH_X265=OFF \
          -DWITH_KVAZAAR=OFF \
          -DWITH_UVG266=OFF \
          -DWITH_VVDEC=OFF \
          -DWITH_VVENC=OFF \
          -DWITH_X264=OFF \
          -DWITH_OpenH264_ENCODER=OFF \
          -DWITH_OpenH264_DECODER=OFF \
          -DWITH_DAV1D=OFF \
          -DWITH_AOM_ENCODER=OFF \
          -DWITH_AOM_DECODER=OFF \
          -DWITH_SvtEnc=OFF \
          -DWITH_RAV1E=OFF \
          -DWITH_JPEG_ENCODER=OFF \
          -DWITH_JPEG_DECODER=OFF \
          -DWITH_OpenJPEG_ENCODER=OFF \
          -DWITH_OpenJPEG_DECODER=OFF \
          -DWITH_FFMPEG_DECODER=OFF \
          -DWITH_OPENJPH_ENCODER=OFF \
          -DWITH_OPENJPH_DECODER=OFF \
          -DWITH_UNCOMPRESSED_CODEC=OFF \
          -DWITH_WEBCODECS=OFF \
          -DWITH_LIBSHARPYUV=OFF \
          -DWITH_EXAMPLES=OFF \
          -DWITH_EXAMPLE_HEIF_THUMB=OFF \
          -DWITH_EXAMPLE_HEIF_VIEW=OFF \
          -DWITH_GDK_PIXBUF=OFF \
          -DBUILD_DOCUMENTATION=OFF \
          -DBUILD_TESTING=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DLIBDE265_INCLUDE_DIR="${{github.workspace}}/thirdparty/libde265/linux/include" \
          -DLIBDE265_LIBRARY="${{github.workspace}}/thirdparty/libde265/linux/lib/libde265.a"
        cmake --build . -j 4
        cmake --install .

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -B ${{github.workspace}}/build -S ${{github.workspace}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/build/install

    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build

    # - name: Test
    #   working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
    #   run: ctest -C ${{env.BUILD_TYPE}}
    - name: install
      run: cmake --install ${{github.workspace}}/build
    - name: Collect dependencies (linuxdeploy)
      working-directory: ${{github.workspace}}
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
        # GitHub runners provide no /dev/fuse, run the AppImage tools in extraction mode
        export APPIMAGE_EXTRACT_AND_RUN=1
        # linuxdeploy-plugin-qt locates Qt via qmake in PATH
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        # 先收集依赖并设置 $ORIGIN rpath（usr/bin、usr/lib、usr/plugins 等），deb 与 appimage 两个步骤共用这个 AppDir
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --executable ./bin/${{env.BUILD_TYPE}}/IIViewer \
          --desktop-file ./icon/IIViewer.desktop \
          --icon-file ./icon/IIViewer.png \
          --plugin qt

    - name: generate deb package
      working-directory: ${{github.workspace}}
      run: |
        # if [[ "$GITHUB_REF" == refs/tags/* ]]; then
        #   VERSION="${GITHUB_REF#refs/tags/v}"
        # elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
        #   VERSION="pr-${GITHUB_HEAD_REF}-${GITHUB_SHA::7}"
        # else
        #  VERSION="dev-${GITHUB_SHA::7}"
        # fi
        VERSION=9.9.9
        echo "VERSION=$VERSION"
        DEBROOT="${{github.workspace}}/debroot"
        rm -rf "$DEBROOT"
        # linuxdeploy 收集好的 AppDir/usr 目录树(bin + lib + plugins + translations + bin/qt.conf)
        # rpath 均为 $ORIGIN 相对路径，整体搬到 /opt/IIViewer 后仍然可用
        mkdir -p "$DEBROOT/opt/IIViewer"
        cp -a ./AppDir/usr/. "$DEBROOT/opt/IIViewer/"
        rm -rf "$DEBROOT/opt/IIViewer/share"
        # 规范 /opt 树的权限，保证 root 以外的用户也能读取执行
        chmod -R u+rwX,go+rX "$DEBROOT/opt/IIViewer"
        # 启动脚本：desktop 文件中的 Exec=IIViewer 通过它落到 /opt 里的真实二进制
        mkdir -p "$DEBROOT/usr/bin"
        cat > "$DEBROOT/usr/bin/IIViewer" <<'EOF'
        #!/bin/bash
        exec /opt/IIViewer/bin/IIViewer "$@"
        EOF
        chmod 755 "$DEBROOT/usr/bin/IIViewer"
        # desktop 文件：dpkg 安装时自动落到 /usr/share/applications，即可在应用菜单中单击启动
        mkdir -p "$DEBROOT/usr/share/applications"
        sed -e '/^X-AppImage-Version/d' ./AppDir/usr/share/applications/IIViewer.desktop \
          > "$DEBROOT/usr/share/applications/IIViewer.desktop"
        # 各尺寸图标装入 hicolor 图标主题
        for size in 16 20 24 32 48 64 128 256 512; do
          mkdir -p "$DEBROOT/usr/share/icons/hicolor/${size}x${size}/apps"
          cp "./icon/IIViewer_${size}.png" "$DEBROOT/usr/share/icons/hicolor/${size}x${size}/apps/IIViewer.png"
        done
        mkdir -p "$DEBROOT/usr/share/doc/iiviewer"
        cp ./LICENSE.txt "$DEBROOT/usr/share/doc/iiviewer/copyright"
        # dpkg 控制信息：Qt 依赖已全部打包进 /opt，仅需声明系统级库
        mkdir -p "$DEBROOT/DEBIAN"
        cat > "$DEBROOT/DEBIAN/control" <<EOF
        Package: iiviewer
        Version: $VERSION
        Architecture: amd64
        Section: graphics
        Priority: optional
        Maintainer: JonahZeng <JonahZeng@github>
        Depends: libc6, libstdc++6, libgcc-s1, libgl1, libegl1, libopengl0, libx11-6, libxcb1, libfontconfig1, libfreetype6, libexpat1, libuuid1, libcom-err2, libgpg-error0, zlib1g
        Description: Cross-platform image viewer for ISP developers
         Supports RAW, MIPI-RAW, RGBIR-RAW, DNG, YUV, RGB, PGM, PNM, HEIF and
         standard image formats (JPG, BMP, PNG, TIFF).
        EOF
        cat > "$DEBROOT/DEBIAN/postinst" <<'EOF'
        #!/bin/sh
        if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database -q || true
        fi
        if command -v gtk-update-icon-cache >/dev/null 2>&1; then
          gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
        fi
        EOF
        chmod 755 "$DEBROOT/DEBIAN/postinst"
        dpkg-deb --build --root-owner-group "$DEBROOT" "IIViewer-${VERSION}-ubuntu-amd64.deb"
    - name: generate appimage package
      working-directory: ${{github.workspace}}
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/v}"
        elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          VERSION="pr-${GITHUB_HEAD_REF}-${GITHUB_SHA::7}"
        else
          VERSION="dev-${GITHUB_SHA::7}"
        fi
        echo "VERSION=$VERSION"
        export OUTPUT="IIViewer-${VERSION}-ubuntu-amd64.AppImage"
        export VERSION="${VERSION}"
        # linuxdeploy + AppImage plugin
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
        chmod +x linuxdeploy-plugin-appimage-x86_64.AppImage
        # GitHub runners provide no /dev/fuse, run the AppImage tools in extraction mode
        export APPIMAGE_EXTRACT_AND_RUN=1
        # linuxdeploy-plugin-qt locates Qt via qmake in PATH
        export PATH="$QT_ROOT_DIR/bin:$PATH"
        # linuxdeploy 不会改写 desktop 模板里的占位版本号，打包前替换为实际版本
        sed -i "s/^X-AppImage-Version=.*/X-AppImage-Version=${VERSION}/" ./AppDir/usr/share/applications/IIViewer.desktop
        # 依赖已在 Collect dependencies 步骤收集完成，此处只补上 AppImage 外壳
        ./linuxdeploy-x86_64.AppImage \
          --appdir AppDir \
          --executable ./bin/${{env.BUILD_TYPE}}/IIViewer \
          --desktop-file ./icon/IIViewer.desktop \
          --icon-file ./icon/IIViewer.png \
          --plugin qt \
          --output appimage
        rm linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage linuxdeploy-plugin-appimage-x86_64.AppImage
        zsyncmake -u "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${OUTPUT}" "./${OUTPUT}"
